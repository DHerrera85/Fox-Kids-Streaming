<!-- Agregar estos estilos en el <style> de series.html -->
<style>
.timeline-section {
  margin: 30px 0;
  padding: 20px 0;
}

.timeline-section h3 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 18px;
  color: #fff;
}

.timeline-container {
  position: relative;
  max-width: 100%;
}

/* Línea central vertical (mobile) */
.timeline-line {
  position: absolute;
  left: 20px;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, #ffc400 0%, #ff6b00 50%, #ff4a00 100%);
}

.timeline-group {
  margin-bottom: 40px;
}

.decade-label {
  position: relative;
  left: 70px;
  font-size: 14px;
  font-weight: 900;
  color: #ffc400;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
  margin-bottom: 15px;
  letter-spacing: 0.05em;
}

.timeline-items {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.timeline-item {
  display: flex;
  gap: 15px;
  align-items: flex-start;
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
  position: relative;
}

.timeline-item:hover {
  transform: translateX(8px);
  opacity: 1;
}

.timeline-dot {
  position: relative;
  width: 18px;
  height: 18px;
  background: #ffc400;
  border-radius: 50%;
  border: 4px solid var(--bg);
  flex-shrink: 0;
  margin-top: 4px;
  box-shadow: 0 0 12px rgba(255, 196, 0, 0.6);
}

.timeline-dot::after {
  content: "";
  position: absolute;
  inset: -6px;
  border: 2px solid rgba(255, 196, 0, 0.3);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
}

.timeline-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.3);
  border-left: 3px solid #ffc400;
  border-radius: 6px;
  flex: 1;
}

.timeline-content .year {
  font-size: 11px;
  color: #ffc400;
  font-weight: 900;
  letter-spacing: 0.05em;
}

.timeline-content .title {
  font-size: 12px;
  color: #fff;
  font-weight: 800;
  line-height: 1.2;
}

/* DESKTOP LAYOUT (768px+) */
@media (min-width: 768px) {
  .timeline-container {
    position: relative;
  }

  /* Línea horizontal en desktop */
  .timeline-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    bottom: auto;
    width: auto;
    height: 4px;
    transform: translateY(-50%);
  }

  .timeline-group {
    position: relative;
    margin-bottom: 60px;
    padding-left: 40px;
  }

  .decade-label {
    position: relative;
    left: 0;
    font-size: 16px;
    margin-bottom: 20px;
  }

  .timeline-items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }

  .timeline-item {
    flex-direction: column;
    align-items: flex-start;
    padding: 12px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
    border: 2px solid rgba(255, 196, 0, 0.2);
    transition: all 0.3s ease;
  }

  .timeline-item:hover {
    transform: translateY(-6px);
    background: rgba(0, 0, 0, 0.4);
    border-color: rgba(255, 196, 0, 0.6);
    box-shadow: 0 8px 20px rgba(255, 196, 0, 0.15);
  }

  .timeline-dot {
    display: none;
  }

  .timeline-content {
    border-left: none;
    border-top: 3px solid #ffc400;
    padding: 8px 0;
    background: transparent;
  }

  .timeline-content .year {
    font-size: 13px;
  }

  .timeline-content .title {
    font-size: 13px;
  }
}
</style>
