  <!-- JS -->
  <script>
    document.addEventListener('DOMContentLoaded', loadArticlesPage);

    async function loadArticlesPage(){
      const grid=document.getElementById('articles-grid');
      if(!grid) return;
      try{
        const res=await fetch('data/articles.json');
        const items=await res.json();
        grid.innerHTML=items.map(a=>{
          const link=a.sourceUrl||a.url||'#';
          const external=Boolean(a.sourceUrl);
          return `
            <div class="article-card ${external?'external':''}">
              <a href="${link}" target="${external?'_blank':'_self'}" rel="${external?'noopener noreferrer':''}" style="color:inherit;text-decoration:none;display:block;">
                <img src="${a.image||'img/articles/article-01.png'}" alt="${a.title||'Artículo'}" loading="lazy" />
                <div class="article-meta">${a.date||''} • ${a.author||'Fox Kids'}</div>
                <div class="article-title">${a.title||''}</div>
                <div class="article-summary">${a.summary||''}</div>
                <div class="article-readmore"><span>READ MORE</span></div>
              </a>
            </div>`;
        }).join('');
      }catch(err){
        grid.innerHTML='<div style="color:#fff;opacity:.85">No pudimos cargar los artículos.</div>';
        console.error(err);
      }
    }
  </script>
