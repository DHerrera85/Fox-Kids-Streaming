<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fox Kids Demo Mobile Menu</title>

<style>
    body {
        margin: 0;
        font-family: 'Comic Neue', sans-serif;
        background: #ff4500;
        color: white;
    }

    /* 🔥 Encabezado */
    header {
        background: #b00000;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header img {
        height: 60px;
    }

    /* 🔥 Botón Hamburger */
    .hamburger {
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
    }

    .hamburger span {
        display: block;
        height: 6px;
        background: yellow;
        border-radius: 5px;
        transition: 0.3s;
    }

    /* 🔥 Sidebar Menu */
    .sidebar {
        position: fixed;
        top: 0;
        left: -260px;
        width: 250px;
        height: 100%;
        background: #cc0000;
        padding-top: 80px;
        transition: 0.4s;
        z-index: 20;
    }

    .sidebar a {
        display: block;
        padding: 18px;
        margin: 8px;
        background: #ff0000;
        border-radius: 12px;
        text-decoration: none;
        color: white;
        font-size: 20px;
        text-align: center;
    }

    .sidebar.open {
        left: 0;
    }

    /* 🔥 Contenido de prueba */
    .hero {
        margin: 20px;
        background: white;
        color: black;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
    }

    /* Desktop: el menú lateral vuelve fijo */
    @media (min-width: 900px) {
        .hamburger { display: none; }
        .sidebar {
            position: static;
            width: 200px;
            height: 100vh;
            display: inline-block;
        }
        .content {
            margin-left: 210px;
        }
    }
</style>
</head>

<body>

<header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Fox_Kids_logo.svg/640px-Fox_Kids_logo.svg.png">
    <div class="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</header>

<!-- 🔥 Menú lateral -->
<div id="sidebar" class="sidebar">
    <a href="#">Home</a>
    <a href="#">Shows</a>
    <a href="#">Articles</a>
    <a href="#">Videos</a>
    <a href="#">Schedule</a>
</div>

<!-- 🔥 Contenido de prueba -->
<div class="content">
    <div class="hero">
        <h1>Fox Kids To The Rescue!</h1>
        <p>Demo con menú mobile totalmente funcional</p>
    </div>
</div>

<script>
function toggleMenu() {
    let menu = document.getElementById('sidebar');
    menu.classList.toggle('open');
}
</script>

</body>
</html>
