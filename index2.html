<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="flicker-screen"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <img src="img/FOX_Kids_logo-_200___176-transparent.png" alt="Fox Kids" class="sidebar-logo">
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Schedule</a></li>
                <li><a href="#">Shows</a></li>
                <li><a href="#">Gallery</a></li>
            </ul>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header Section -->
        <header class="main-header">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Schedule</a></li>
                <li><a href="#">Shows</a></li>
                <li><a href="#">Gallery</a></li>
            </ul>
        </header>

        <!-- Horizontal Feature Gallery -->
        <div class="feature-gallery">
            <h2>Feature Gallery</h2>
            <div class="feature-slider">
                <button class="prev-feature" aria-label="Previous Feature Image">&#10094;</button>
                <div class="feature-images">
                    <img src="img/01.jim-button-vertical.jpg" alt="Feature Image 1">
                    <img src="img/02.bobbys-world-vertical.jpg" alt="Feature Image 2">
                    <img src="img/03.masked-rider-vertical.jpg" alt="Feature Image 3">
                </div>
                <button class="next-feature" aria-label="Next Feature Image">&#10095;</button>
            </div>
        </div>

        <!-- Vertical Image Gallery -->
        <div class="vertical-gallery">
            <h2>Vertical Gallery</h2>
            <div class="vertical-slider">
                <button class="prev-vertical" aria-label="Previous Vertical Image">&#10094;</button>
                <div class="vertical-images">
                    <img src="img/vertical1.jpg" alt="Vertical Image 1">
                    <img src="img/vertical2.jpg" alt="Vertical Image 2">
                    <img src="img/vertical3.jpg" alt="Vertical Image 3">
                </div>
                <button class="next-vertical" aria-label="Next Vertical Image">&#10095;</button>
            </div>
        </div>

        <!-- Schedule Section -->
        <div class="schedule">
            <h2>Fox Kids Schedule</h2>
            <ul>
                <li>10:00 - Jim Button</li>
                <li>10:30 - El Mundo de Bobby</li>
                <!-- Add your full schedule here -->
            </ul>
        </div>
    </div>
</body>
</html>
