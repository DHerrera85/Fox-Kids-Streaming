<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Kids Streaming - Serie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="search-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Audiowide', Impact, Haettenschweiler, 'Arial Narrow', sans-serif;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #FFD200;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #FFD200;
        }

        .back-btn {
            background: #FFD200;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #FFF;
            transform: scale(1.05);
        }

        .serie-header {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .poster {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(255, 210, 0, 0.3);
        }

        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD200;
        }

        .meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .meta-item {
            background: rgba(255, 210, 0, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #FFD200;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
        }

        .seasons-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }

        /* Player estilo shorts.html (adaptado) */
        .video-gallery{padding:10px 40px;}
        .video-frame{position:relative;width:100%;border-radius:12px;background:#000;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.22);} 
        .video-frame::before{content:"";display:block;width:100%;padding-top:56.25%;}
        .video-frame .video-inner{position:absolute;inset:0;}
        .video-frame video{width:100%;height:100%;border-radius:12px;background:#000;object-fit:contain;}
        .video-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;padding:0 40px;}
        .video-controls{display:flex;gap:8px;}
        .ctrl-btn{background:rgba(0,0,0,.55);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer;}
        .ctrl-btn:hover{background:rgba(0,0,0,.75);}  
        .queue-panel{margin:10px 40px;background:#f9fafb;border:2px solid #e5e7eb;border-radius:14px;padding:12px;}
        .queue-title{font-size:13px;font-weight:900;color:#111;margin-bottom:8px;}
        .queue-list{display:flex;flex-direction:column;gap:8px;}
        .queue-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fff;border:2px solid #e5e7eb;border-radius:12px;transition:all .2s ease;}
        .queue-item.playing{background:#fff3cd;border-color:#FFD200;box-shadow:0 4px 12px rgba(255,212,0,.25);}
        .queue-item-left{display:flex;align-items:center;gap:8px;color:#111;font-size:12px;font-weight:900;flex:1;min-width:0;}
        .queue-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#111;flex-shrink:0;}
        .queue-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .q-btn{background:#f2f3f5;color:#111;border:2px solid rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;}
        .q-btn.play{background:#16a34a;color:#fff;border-color:#15803d;}
        .q-btn.remove{background:#e20000;color:#fff;border-color:#b00000;}

        /* Carouseles de relacionados */
        .related-section{margin:20px 40px;}
        .related-title{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 10px;gap:6px;}
        .related-title h2{margin:0;font-size:16px;letter-spacing:.1px;color:#FFD200;}
        .shorts-wrapper{position:relative;margin:0 0 10px;}
        .shorts{display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;user-select:none;height:255px;align-items:center;}
        .shorts::-webkit-scrollbar{display:none;}
        .short{flex:0 0 auto;width:140px;height:255px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#111827,#7c3aed 55%,#ff3b86);box-shadow:0 14px 30px rgba(0,0,0,.22);position:relative;scroll-snap-align:start;border:3px solid rgba(0,0,0,.10);background-size:cover;background-position:center;}
        .short .play{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:14px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff;font-size:16px;}
        .short .t{position:absolute;left:10px;right:10px;bottom:12px;color:#fff;font-weight:1000;font-size:12px;text-shadow:0 6px 18px rgba(0,0,0,.45);padding-left:44px;line-height:1.1;}
        .short .badge{position:absolute;top:10px;left:10px;background:rgba(255,196,0,.95);color:#111;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:1000;}

        .season {
            margin-bottom: 40px;
        }

        .season-title {
            font-size: 28px;
            color: #FFD200;
            margin-bottom: 20px;
            border-bottom: 2px solid #FFD200;
            padding-bottom: 10px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: rgba(255, 210, 0, 0.1);
            border: 2px solid rgba(255, 210, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .episode-card:hover {
            border-color: #FFD200;
            background: rgba(255, 210, 0, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 210, 0, 0.2);
        }

        .episode-number {
            font-size: 14px;
            color: #FFD200;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .episode-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .episode-duration {
            font-size: 13px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 18px;
        }

        .error {
            text-align: center;
            padding: 100px 20px;
            color: #ff6b6b;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .serie-header {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .title {
                font-size: 32px;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 10px;
            }

            .back-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎬 FOX KIDS</div>
        <button class="back-btn" onclick="goBack()">← Volver</button>
    </header>

        <div id="content">

                <body>
                <div class="app">
                    <header class="topbar">
                        <div class="topbar-row">
                            <div class="logo" onclick="location.href='index.html'" title="Ir al inicio">
                                <div class="logo-badge"><img src="img/FOX_Kids_logo-_200___176-transparent.png" alt="Fox Kids"></div>
                                <div class="hello">
                                    <div class="hi">Fox Kids</div>
                                    <div class="sub">Fan Mode • Streaming</div>
                                </div>
                            </div>
                            <div class="icons">
                                <div class="icon-btn search-icon-btn" title="Buscar" onclick="if(typeof foxSearch!=='undefined') foxSearch.openSearch();"><span class="icon">🔍</span></div>
                                <div class="icon-btn" title="Volver" onclick="history.back();"><span class="icon">↩</span></div>
                            </div>
                        </div>
                        <div class="search">
                            <div class="search-pill">
                                <span class="glass">🔍</span>
                                <input id="q" placeholder="¿Qué andás buscando? (ej: Digimon, Power Rangers)" onclick="if(typeof foxSearch!=='undefined') foxSearch.openSearch();" readonly />
                            </div>
                            <div class="tag">LIVE</div>
                        </div>
                    </header>

                    <main class="content">
                        <div id="heroContainer" class="hero" style="display:none;"></div>

                        <section class="video-gallery" id="playerSection" style="display:none;">
                            <div class="section-title">
                                <h2>Reproductor</h2>
                                <span class="hint" id="playerTitle">Selecciona un video</span>
                            </div>
                            <div class="video-frame">
                                <div class="video-inner">
                                    <video id="mainVideo" style="display:none;" controls playsinline>
                                        Tu navegador no soporta videos HTML5
                                    </video>
                                    <div id="playerPlaceholder" style="position:absolute;inset:0;background:#111;border-radius:12px;padding:40px;text-align:center;color:#FFD200;display:flex;align-items:center;justify-content:center;">
                                        👆 Selecciona un video de los relacionados para reproducir
                                    </div>
                                </div>
                            </div>
                            <div class="video-toolbar">
                                <div class="video-controls">
                                    <button class="ctrl-btn" onclick="prevInQueue()">⟵ Anterior</button>
                                    <button class="ctrl-btn" onclick="togglePlayPause()" id="playPauseBtn">▶ Reproducir</button>
                                    <button class="ctrl-btn" onclick="nextInQueue()">Siguiente ⟶</button>
                                </div>
                            </div>
                            <div class="queue-panel" id="queuePanel" style="display:none;">
                                <div class="queue-title">Cola de reproducción</div>
                                <div class="queue-list" id="queueList"></div>
                            </div>
                        </section>

                        <div id="relatedSections"></div>
                        <div id="seasonsContainer" class="seasons-container"></div>
                        <div id="content" class="loading">Cargando serie...</div>
                    </main>
                </div>

                <script src="search.js"></script>
                <script>
                    let searchIndex=null; let currentSerie=null; let playingQueue=[]; let currentIndex=-1;

                    const norm = (s='') => s.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().trim();

                    async function loadIndex(){
                        try{const resp=await fetch('data/search-index.json'); searchIndex=await resp.json();}
                        catch(e){console.error('No se pudo cargar índice',e); showError('No se pudo cargar la serie');}
                    }

                    function getParam(name){return new URLSearchParams(window.location.search).get(name);}

                    function loadSerie(){
                        const id=getParam('id'); if(!id||!searchIndex){showError('Serie no encontrada');return;}
                        const serie=searchIndex.series.find(s=>s.id===id);
                        if(!serie){showError('Serie no encontrada');return;}
                        currentSerie=serie; renderHero(serie); renderSeasons(serie); renderRelated(serie);
                        document.getElementById('playerSection').style.display='block';
                        document.getElementById('content').style.display='none';
                    }

                    function renderHero(serie){
                        const hero=document.getElementById('heroContainer');
                        hero.innerHTML=`
                            <div class="hero-poster" style="background-image:url('${serie.image||''}');"></div>
                            <div>
                                <h1 class="hero-title">${serie.name}</h1>
                                <div class="hero-meta">
                                    <div class="chip">📅 ${serie.year||'N/A'}</div>
                                    <div class="chip">⭐ ${serie.rating||'N/A'}</div>
                                    <div class="chip">📺 ${serie.category||'N/A'}</div>
                                </div>
                                <p class="hero-desc">${serie.description||'No hay descripción disponible'}</p>
                            </div>`;
                        hero.style.display='grid';
                    }

                    function renderSeasons(serie){
                        const cont=document.getElementById('seasonsContainer');
                        if(!serie.seasons||!serie.seasons.length){cont.innerHTML='';return;}
                        cont.innerHTML=serie.seasons.map(season=>`
                            <div class="season">
                                <h3 class="season-title">Temporada ${season.season}</h3>
                                <div class="episodes-grid">
                                    ${season.episodes.map(ep=>`
                                        <div class="episode-card" onclick="playEpisode('${ep.video}','${serie.name} - ${ep.title}','${serie.id}')">
                                            <div class="episode-number">Ep. ${ep.number}</div>
                                            <div class="episode-title">${ep.title}</div>
                                            <div class="episode-duration">⏱️ ${ep.duration}</div>
                                        </div>`).join('')}
                                </div>
                            </div>`).join('');
                    }

                    function filterRelated(serie){
                        if(!searchIndex||!searchIndex.videos) return {openings:[],promosUS:[],promosLATAM:[]};
                        const target=norm(serie.name);
                        const rel=searchIndex.videos.filter(v=>norm(v.series||'')===target || norm(v.seriesId||'')===norm(serie.id));
                        return {
                            openings: rel.filter(v=>norm(v.category)==='openings'),
                            promosUS: rel.filter(v=>norm(v.subcategory)==='promos' && (v.region||'').toUpperCase()==='US'),
                            promosLATAM: rel.filter(v=>norm(v.subcategory)==='promos' && (v.region||'').toUpperCase()==='LATAM')
                        };
                    }

                    function renderRelated(serie){
                        const {openings,promosUS,promosLATAM}=filterRelated(serie);
                        const container=document.getElementById('relatedSections');
                        const block=(title,list)=> list.length?`
                            <section class="related-section">
                                <div class="related-title"><h2>${title}</h2><span class="hint">${list.length} videos</span></div>
                                <div class="shorts-wrapper"><div class="shorts">${list.map(renderShortCard).join('')}</div></div>
                            </section>`:'';
                        container.innerHTML=block('Openings',openings)+block('Promos US',promosUS)+block('Promos LATAM',promosLATAM);
                    }

                    function renderShortCard(item){
                        const bg=item.image?`background-image:url('${item.image}')`:`background:linear-gradient(135deg,#ff7a00,#ff2b70 55%,#7c3aed)`;
                        const badge=norm(item.category)==='openings'?'OPENING':'PROMO';
                        const region=item.region?` • ${item.region}`:'';
                        return `<div class="short" style="${bg};background-size:cover;background-position:center;" onclick='playShort(${JSON.stringify(item)})'>
                            <div class="badge">${badge}${region}</div>
                            <div class="play">▶</div>
                            <div class="t">${item.name}</div>
                        </div>`;
                    }

                    // Player helpers
                    function ensureVideo(){return document.getElementById('mainVideo');}
                    function showVideo(){document.getElementById('playerPlaceholder').style.display='none';const v=ensureVideo();v.style.display='block';return v;}
                    function playShort(item){
                        const idx=playingQueue.findIndex(x=>x.file===item.file);
                        if(idx===-1){playingQueue.push(item); currentIndex=playingQueue.length-1; renderQueue();}
                        else {currentIndex=idx;}
                        const v=showVideo(); v.src=item.file; v.play().catch(()=>{}); document.getElementById('playerTitle').textContent=item.name; updatePlayPauseBtn();
                    }
                    function renderQueue(){
                        const list=document.getElementById('queueList'); if(!list) return;
                        list.innerHTML=playingQueue.map((q,i)=>`
                            <div class="queue-item ${i===currentIndex?'playing':''}">
                                <div class="queue-item-left">
                                    <img class="queue-thumb" src="${q.image||''}" alt=""/>
                                    <div class="queue-item-title">${q.name}</div>
                                </div>
                                <div>
                                    <button class="q-btn play" onclick="jumpTo(${i})">▶</button>
                                    <button class="q-btn remove" onclick="removeFromQueue(${i})">🗑️</button>
                                </div>
                            </div>`).join('');
                        document.getElementById('queuePanel').style.display=playingQueue.length?'block':'none';
                    }
                    function jumpTo(i){if(i<0||i>=playingQueue.length) return; currentIndex=i; playShort(playingQueue[i]);}
                    function removeFromQueue(i){playingQueue.splice(i,1); if(currentIndex>=playingQueue.length) currentIndex=playingQueue.length-1; renderQueue();}
                    function nextInQueue(){if(!playingQueue.length) return; currentIndex=(currentIndex+1)%playingQueue.length; playShort(playingQueue[currentIndex]);}
                    function prevInQueue(){if(!playingQueue.length) return; currentIndex=(currentIndex-1+playingQueue.length)%playingQueue.length; playShort(playingQueue[currentIndex]);}
                    function togglePlayPause(){const v=ensureVideo(); if(v.paused){v.play();} else {v.pause();} updatePlayPauseBtn();}
                    function updatePlayPauseBtn(){const v=ensureVideo(); document.getElementById('playPauseBtn').textContent=v.paused?'▶ Reproducir':'⏸ Pausar';}

                    function playEpisode(videoFile,title,serieId){
                        playShort({file:videoFile,name:title,image:currentSerie?.image||'',seriesId:serieId});
                    }

                    function showError(msg){const c=document.getElementById('content'); if(c){c.style.display='block'; c.innerHTML=`<div class="error">${msg}</div>`;}}

                    window.playShort=playShort; window.prevInQueue=prevInQueue; window.nextInQueue=nextInQueue; window.togglePlayPause=togglePlayPause; window.jumpTo=jumpTo; window.removeFromQueue=removeFromQueue; window.playEpisode=playEpisode;

                    document.addEventListener('DOMContentLoaded', async()=>{await loadIndex(); loadSerie();});
                </script>
                </body>
                </html>
