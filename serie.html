<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Kids Streaming - Serie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="search-styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Audiowide', Impact, Haettenschweiler, 'Arial Narrow', sans-serif;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #FFD200;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #FFD200;
        }

        .back-btn {
            background: #FFD200;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #FFF;
            transform: scale(1.05);
        }

        .serie-header {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .poster {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(255, 210, 0, 0.3);
        }

        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD200;
        }

        .meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .meta-item {
            background: rgba(255, 210, 0, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #FFD200;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
        }

        .seasons-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }

        /* Player estilo shorts.html (adaptado) */
        .video-gallery{padding:10px 40px;}
        .video-frame{position:relative;width:100%;border-radius:12px;background:#000;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.22);} 
        .video-frame::before{content:"";display:block;width:100%;padding-top:56.25%;}
        .video-frame .video-inner{position:absolute;inset:0;}
        .video-frame video{width:100%;height:100%;border-radius:12px;background:#000;object-fit:contain;}
        .video-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;padding:0 40px;}
        .video-controls{display:flex;gap:8px;}
        .ctrl-btn{background:rgba(0,0,0,.55);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer;}
        .ctrl-btn:hover{background:rgba(0,0,0,.75);}  
        .queue-panel{margin:10px 40px;background:#f9fafb;border:2px solid #e5e7eb;border-radius:14px;padding:12px;}
        .queue-title{font-size:13px;font-weight:900;color:#111;margin-bottom:8px;}
        .queue-list{display:flex;flex-direction:column;gap:8px;}
        .queue-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;background:#fff;border:2px solid #e5e7eb;border-radius:12px;transition:all .2s ease;}
        .queue-item.playing{background:#fff3cd;border-color:#FFD200;box-shadow:0 4px 12px rgba(255,212,0,.25);}
        .queue-item-left{display:flex;align-items:center;gap:8px;color:#111;font-size:12px;font-weight:900;flex:1;min-width:0;}
        .queue-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#111;flex-shrink:0;}
        .queue-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .q-btn{background:#f2f3f5;color:#111;border:2px solid rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;}
        .q-btn.play{background:#16a34a;color:#fff;border-color:#15803d;}
        .q-btn.remove{background:#e20000;color:#fff;border-color:#b00000;}

        /* Carouseles de relacionados */
        .related-section{margin:20px 40px;}
        .related-title{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 10px;gap:6px;}
        .related-title h2{margin:0;font-size:16px;letter-spacing:.1px;color:#FFD200;}
        .shorts-wrapper{position:relative;margin:0 0 10px;}
        .shorts{display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;user-select:none;height:255px;align-items:center;}
        .shorts::-webkit-scrollbar{display:none;}
        .short{flex:0 0 auto;width:140px;height:255px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#111827,#7c3aed 55%,#ff3b86);box-shadow:0 14px 30px rgba(0,0,0,.22);position:relative;scroll-snap-align:start;border:3px solid rgba(0,0,0,.10);background-size:cover;background-position:center;}
        .short .play{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:14px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff;font-size:16px;}
        .short .t{position:absolute;left:10px;right:10px;bottom:12px;color:#fff;font-weight:1000;font-size:12px;text-shadow:0 6px 18px rgba(0,0,0,.45);padding-left:44px;line-height:1.1;}
        .short .badge{position:absolute;top:10px;left:10px;background:rgba(255,196,0,.95);color:#111;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:1000;}

        .season {
            margin-bottom: 40px;
        }

        .season-title {
            font-size: 28px;
            color: #FFD200;
            margin-bottom: 20px;
            border-bottom: 2px solid #FFD200;
            padding-bottom: 10px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: rgba(255, 210, 0, 0.1);
            border: 2px solid rgba(255, 210, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .episode-card:hover {
            border-color: #FFD200;
            background: rgba(255, 210, 0, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 210, 0, 0.2);
        }

        .episode-number {
            font-size: 14px;
            color: #FFD200;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .episode-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .episode-duration {
            font-size: 13px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 18px;
        }

        .error {
            text-align: center;
            padding: 100px 20px;
            color: #ff6b6b;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .serie-header {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .title {
                font-size: 32px;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 10px;
            }

            .back-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎬 FOX KIDS</div>
        <button class="back-btn" onclick="goBack()">← Volver</button>
    </header>

        <div id="content">
                <div class="loading">Cargando serie...</div>
        </div>
    
        <!-- PLAYER SUPERIOR (estilo shorts) -->
        <section class="video-gallery" id="playerSection" style="display:none;">
            <div class="section-title" style="margin:0 40px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;">
                <h2>Reproductor</h2>
                <span class="hint" id="playerTitle">Selecciona un video</span>
            </div>
            <div class="video-frame">
                <div class="video-inner">
                    <video id="mainVideo" style="display:none;" controls playsinline>
                        Tu navegador no soporta videos HTML5
                    </video>
                    <div id="playerPlaceholder" style="position:absolute;inset:0;background:#111;border-radius:12px;padding:40px;text-align:center;color:#FFD200;display:flex;align-items:center;justify-content:center;">
                        👆 Selecciona un video de los relacionados para reproducir
                    </div>
                </div>
            </div>
            <div class="video-toolbar">
                <div class="video-controls">
                    <button class="ctrl-btn" onclick="prevInQueue()">⟵ Anterior</button>
                    <button class="ctrl-btn" onclick="togglePlayPause()" id="playPauseBtn">▶ Reproducir</button>
                    <button class="ctrl-btn" onclick="nextInQueue()">Siguiente ⟶</button>
                </div>
            </div>
            <div class="queue-panel" id="queuePanel" style="display:none;">
                <div class="queue-title">Cola de reproducción</div>
                <div class="queue-list" id="queueList"></div>
            </div>
        </section>

    <script>
        let currentSerie = null;
        let searchIndex = null;
        let playingQueue = [];
        let currentIndex = -1;

        // Cargar el índice de búsqueda
        async function loadIndex() {
            try {
                const response = await fetch('data/search-index.json');
                searchIndex = await response.json();
            } catch (error) {
                console.error('Error cargando índice:', error);
                showError('No se pudo cargar la serie');
            }
        }

        // Obtener parámetro de URL
        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // Cargar serie específica
        function loadSerie() {
            const serieId = getUrlParameter('id');
            
            if (!serieId || !searchIndex) {
                showError('Serie no encontrada');
                return;
            }

            const serie = searchIndex.series.find(s => s.id === serieId);
            
            if (!serie) {
                showError('Serie no encontrada');
                return;
            }

            currentSerie = serie;
            renderSerie(serie);
        }

        // Renderizar la serie
        function renderSerie(serie) {
            const content = document.getElementById('content');
            
            let seasonsHTML = '';
            
            if (serie.seasons && serie.seasons.length > 0) {
                seasonsHTML = serie.seasons.map(season => `
                    <div class="season">
                        <h2 class="season-title">Temporada ${season.season}</h2>
                        <div class="episodes-grid">
                            ${season.episodes.map(episode => `
                                <div class="episode-card" onclick="playEpisode('${episode.video}', '${serie.name} - ${episode.title}', '${serie.id}')">
                                    <div class="episode-number">Ep. ${episode.number}</div>
                                    <div class="episode-title">${episode.title}</div>
                                    <div class="episode-duration">⏱️ ${episode.duration}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

                        content.innerHTML = `
                <div class="serie-header">
                    <img src="${serie.image}" alt="${serie.name}" class="poster">
                    <div class="info">
                        <h1 class="title">${serie.name}</h1>
                        <div class="meta">
                            <div class="meta-item">📅 ${serie.year || 'N/A'}</div>
                            <div class="meta-item">⭐ ${serie.rating || 'N/A'}</div>
                            <div class="meta-item">📺 ${serie.category || 'N/A'}</div>
                        </div>
                        <p class="description">${serie.description || 'No hay descripción disponible'}</p>
                    </div>
                </div>
                <div class="seasons-container">
                    ${seasonsHTML || '<p style="text-align: center; color: #aaa;">No hay episodios disponibles</p>'}
                </div>
                                <div id="relatedSections"></div>
            `;

                        // Mostrar player superior
                        document.getElementById('playerSection').style.display = 'block';

                        // Render relacionados
                        renderRelatedShorts(serie);
        }

                function renderRelatedShorts(serie){
                        if(!searchIndex || !searchIndex.videos) return;
                        const related = searchIndex.videos.filter(v => (v.series?.toLowerCase()||'') === (serie.name.toLowerCase()));

                        const openings = related.filter(v => (v.category||'').toLowerCase()==='openings');
                        const promosUS = related.filter(v => (v.subcategory||'').toLowerCase()==='promos' && (v.region||'').toUpperCase()==='US');
                        const promosLATAM = related.filter(v => (v.subcategory||'').toLowerCase()==='promos' && (v.region||'').toUpperCase()==='LATAM');

                        const container = document.getElementById('relatedSections');
                        const sectionHTML = (title, list) => list.length ? `
                            <section class="related-section">
                                <div class="related-title"><h2>${title}</h2><span class="hint">${list.length} videos</span></div>
                                <div class="shorts-wrapper">
                                    <div class="shorts">
                                        ${list.map((item,idx)=>renderShortCard(item, idx)).join('')}
                                    </div>
                                </div>
                            </section>
                        `: '';

                        container.innerHTML = sectionHTML('Openings', openings) + sectionHTML('Promos US', promosUS) + sectionHTML('Promos LATAM', promosLATAM);
                }

                function renderShortCard(item, idx){
                        const bg = item.image ? `background-image:url('${item.image}')` : `background:linear-gradient(135deg,#ff7a00,#ff2b70 55%,#7c3aed)`;
                        const badge = item.category==='Openings' ? 'OPENING' : 'PROMO';
                        const title = item.name;
                        return `<div class="short" style="${bg};background-size:cover;background-position:center;" onclick='playShort(${JSON.stringify(item)})'>
                            <div class="badge">${badge}${item.region? ' • '+item.region:''}</div>
                            <div class="play">▶</div>
                            <div class="t">${title}</div>
                        </div>`;
                }

                // Queue / Player helpers
                function ensureVideo(){ return document.getElementById('mainVideo'); }
                function showVideo(){ document.getElementById('playerPlaceholder').style.display='none'; const v=ensureVideo(); v.style.display='block'; return v; }
                function playShort(item){
                        // push to queue if not exists
                        const existsIndex = playingQueue.findIndex(x=>x.file===item.file);
                        if(existsIndex===-1){ playingQueue.push(item); renderQueue(); currentIndex = playingQueue.length-1; }
                        else { currentIndex = existsIndex; }
                        const v = showVideo();
                        v.src = item.file; v.play().catch(()=>{});
                        document.getElementById('playerTitle').textContent = item.name;
                        updatePlayPauseBtn();
                }
                function renderQueue(){
                        const list = document.getElementById('queueList');
                        if(!list) return; list.innerHTML = playingQueue.map((q,i)=>`
                            <div class="queue-item ${i===currentIndex?'playing':''}">
                                <div class="queue-item-left">
                                    <img class="queue-thumb" src="${q.image||''}" alt=""/>
                                    <div class="queue-item-title">${q.name}</div>
                                </div>
                                <div>
                                    <button class="q-btn play" onclick="jumpTo(${i})">▶</button>
                                    <button class="q-btn remove" onclick="removeFromQueue(${i})">🗑️</button>
                                </div>
                            </div>`).join('');
                        document.getElementById('queuePanel').style.display = playingQueue.length? 'block':'none';
                }
                function jumpTo(i){ if(i<0||i>=playingQueue.length) return; currentIndex=i; playShort(playingQueue[i]); }
                function removeFromQueue(i){ playingQueue.splice(i,1); if(currentIndex>=playingQueue.length) currentIndex=playingQueue.length-1; renderQueue(); }
                function nextInQueue(){ if(!playingQueue.length) return; currentIndex=(currentIndex+1)%playingQueue.length; playShort(playingQueue[currentIndex]); }
                function prevInQueue(){ if(!playingQueue.length) return; currentIndex=(currentIndex-1+playingQueue.length)%playingQueue.length; playShort(playingQueue[currentIndex]); }
                function togglePlayPause(){ const v=ensureVideo(); if(v.paused){ v.play(); } else { v.pause(); } updatePlayPauseBtn(); }
                function updatePlayPauseBtn(){ const v=ensureVideo(); document.getElementById('playPauseBtn').textContent = v.paused? '▶ Reproducir' : '⏸ Pausar'; }

        // Reproducir episodio
        function playEpisode(videoFile, title, serieId) {
            const params = new URLSearchParams({
                file: videoFile,
                title: title,
                serie: serieId,
                returnTo: `serie.html?id=${serieId}`
            });
            window.location.href = `player.html?${params.toString()}`;
        }

        // Mostrar error
        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">${message}</div>`;
        }

        // Volver atrás
        function goBack() {
            window.history.back();
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', async () => {
            await loadIndex();
            loadSerie();
        });

        // Expose helpers for onclick in generated HTML
        window.playShort = playShort;
        window.prevInQueue = prevInQueue;
        window.nextInQueue = nextInQueue;
        window.togglePlayPause = togglePlayPause;
        window.jumpTo = jumpTo;
        window.removeFromQueue = removeFromQueue;
    </script>
</body>
</html>
