<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Kids Streaming - Serie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #FFD200;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #FFD200;
        }

        .back-btn {
            background: #FFD200;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #FFF;
            transform: scale(1.05);
        }

        .serie-header {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .poster {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(255, 210, 0, 0.3);
        }

        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFD200;
        }

        .meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .meta-item {
            background: rgba(255, 210, 0, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            border-left: 3px solid #FFD200;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
        }

        .seasons-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .season {
            margin-bottom: 40px;
        }

        .season-title {
            font-size: 28px;
            color: #FFD200;
            margin-bottom: 20px;
            border-bottom: 2px solid #FFD200;
            padding-bottom: 10px;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .episode-card {
            background: rgba(255, 210, 0, 0.1);
            border: 2px solid rgba(255, 210, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .episode-card:hover {
            border-color: #FFD200;
            background: rgba(255, 210, 0, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 210, 0, 0.2);
        }

        .episode-number {
            font-size: 14px;
            color: #FFD200;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .episode-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .episode-duration {
            font-size: 13px;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 18px;
        }

        .error {
            text-align: center;
            padding: 100px 20px;
            color: #ff6b6b;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .serie-header {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .title {
                font-size: 32px;
            }

            .episodes-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 10px;
            }

            .back-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎬 FOX KIDS</div>
        <button class="back-btn" onclick="goBack()">← Volver</button>
    </header>

    <div id="content">
        <div class="loading">Cargando serie...</div>
    </div>

    <script>
        let currentSerie = null;
        let searchIndex = null;

        // Cargar el índice de búsqueda
        async function loadIndex() {
            try {
                const response = await fetch('data/search-index.json');
                searchIndex = await response.json();
            } catch (error) {
                console.error('Error cargando índice:', error);
                showError('No se pudo cargar la serie');
            }
        }

        // Obtener parámetro de URL
        function getUrlParameter(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // Cargar serie específica
        function loadSerie() {
            const serieId = getUrlParameter('id');
            
            if (!serieId || !searchIndex) {
                showError('Serie no encontrada');
                return;
            }

            const serie = searchIndex.series.find(s => s.id === serieId);
            
            if (!serie) {
                showError('Serie no encontrada');
                return;
            }

            currentSerie = serie;
            renderSerie(serie);
        }

        // Renderizar la serie
        function renderSerie(serie) {
            const content = document.getElementById('content');
            
            let seasonsHTML = '';
            
            if (serie.seasons && serie.seasons.length > 0) {
                seasonsHTML = serie.seasons.map(season => `
                    <div class="season">
                        <h2 class="season-title">Temporada ${season.season}</h2>
                        <div class="episodes-grid">
                            ${season.episodes.map(episode => `
                                <div class="episode-card" onclick="playEpisode('${episode.video}', '${serie.name} - ${episode.title}', '${serie.id}')">
                                    <div class="episode-number">Ep. ${episode.number}</div>
                                    <div class="episode-title">${episode.title}</div>
                                    <div class="episode-duration">⏱️ ${episode.duration}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            content.innerHTML = `
                <div class="serie-header">
                    <img src="${serie.image}" alt="${serie.name}" class="poster">
                    <div class="info">
                        <h1 class="title">${serie.name}</h1>
                        <div class="meta">
                            <div class="meta-item">📅 ${serie.year || 'N/A'}</div>
                            <div class="meta-item">⭐ ${serie.rating || 'N/A'}</div>
                            <div class="meta-item">📺 ${serie.category || 'N/A'}</div>
                        </div>
                        <p class="description">${serie.description || 'No hay descripción disponible'}</p>
                    </div>
                </div>
                <div class="seasons-container">
                    ${seasonsHTML || '<p style="text-align: center; color: #aaa;">No hay episodios disponibles</p>'}
                </div>
            `;
        }

        // Reproducir episodio
        function playEpisode(videoFile, title, serieId) {
            const params = new URLSearchParams({
                file: videoFile,
                title: title,
                serie: serieId,
                returnTo: `serie.html?id=${serieId}`
            });
            window.location.href = `player.html?${params.toString()}`;
        }

        // Mostrar error
        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">${message}</div>`;
        }

        // Volver atrás
        function goBack() {
            window.history.back();
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', async () => {
            await loadIndex();
            loadSerie();
        });
    </script>
</body>
</html>
