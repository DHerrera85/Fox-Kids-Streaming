<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fox Kids – Series</title>
<link rel="icon" type="image/png" href="img/FOX_Kids_logo-_200___176-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css" />
<link rel="stylesheet" href="styles.css">
<style>
  :root{--bg:#ff4a00;--bg2:#ff5b1a;--red:#b00000;--red2:#e20000;--yellow:#ffc400;--card:#ffffff;--ink:#0e0f14;--muted:#6b7280;--radius:18px;--shadow:0 14px 30px rgba(0,0,0,.22);}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font-family:'Audiowide',Impact,Haettenschweiler,'Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.03em;background:var(--bg);color:#fff;}
  .app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-bottom:100px;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--red);padding:12px 14px;box-shadow:0 10px 18px rgba(0,0,0,.25);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .logo{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo-badge{width:60px;height:60px;display:grid;place-items:center;flex-shrink:0;}
  .logo-badge img{width:100%;height:100%;object-fit:contain;}
  .hello{min-width:0}
  .hello .hi{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hello .sub{font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icons{display:flex;gap:10px;}
  .icon-btn{width:40px;height:40px;border-radius:14px;border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.18);color:#fff;display:grid;place-items:center;cursor:pointer;user-select:none;position:relative;}
  .icon{font-size:18px;transform:translateY(-.5px);}
  .search{margin-top:10px;display:flex;gap:10px;align-items:center;}
  .search-pill{flex:1;background:#fff;color:#111;border-radius:999px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 20px rgba(0,0,0,.18);}
  .search-pill .glass{opacity:.7}
  .search-pill input{border:0;outline:0;width:100%;font-size:14px;background:transparent;}
  .tag{background:var(--yellow);color:#111;font-weight:900;border-radius:999px;padding:8px 10px;font-size:12px;box-shadow:0 10px 20px rgba(0,0,0,.18);white-space:nowrap;}
  .content{padding:14px;}
  .round-gallery-section{display:none;}
  
  /* FILTROS DINÁMICOS - Mismo formato que index.html */
  .filters-row{display:flex;gap:10px;overflow:auto;padding:12px 2px 6px;scroll-snap-type:x mandatory;position:sticky;top:64px;z-index:9;}
  .filters-row::-webkit-scrollbar{display:none;}
  .filters-row{-ms-overflow-style:none;scrollbar-width:none;}
  .filter-btn{flex:0 0 auto;background:#f2f3f5;color:#111;padding:9px 14px;border-radius:14px;font-weight:900;font-size:12px;border:1px solid rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;scroll-snap-align:start;font-family:'Audiowide',Impact,Haettenschweiler,'Arial Narrow',sans-serif;transition:all 0.2s ease;}
  .filter-btn:hover{background:#e0e1e5;transform:translateY(-2px);}
  .filter-btn.active{background:#111;color:#fff;border-color:#111;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  
  .gallery-section{transition:opacity 0.3s ease;}
  .gallery-section.hidden{display:none;}
  
  .gallery-section h3{color:#fff;font-size:18px;font-weight:900;margin:20px 0 12px;text-transform:uppercase;letter-spacing:0.05em;}
  
  /* SERIE CARD CON OVERLAY */
  .serie-card{position:relative;cursor:pointer;overflow:hidden;border-radius:8px;}
  .serie-card img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s ease;display:block;}
  .serie-card h4{display:none;}
  .serie-info-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,196,0,.92);padding:16px 12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s ease;z-index:5;}
  .info-content{color:#000;font-size:12px;line-height:1.6;text-align:center;}
  .info-content p{margin:4px 0;}
  .info-content strong{font-size:13px;font-weight:900;display:block;margin-bottom:3px;color:#000;}
  .serie-card:hover .serie-info-overlay{opacity:1;}
  .serie-card:hover img{transform:scale(1.05);}
  
  /* Mobile - Overlay interactivo al hacer click */
  @media (max-width: 768px) {
    .serie-card.active .serie-info-overlay{opacity:1;}
  }
  
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(430px, calc(100% - 20px));background:rgba(0,0,0,.82);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:10px;display:flex;justify-content:space-between;gap:8px;z-index:50;box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(10px);}
  .nav-item{flex:1;color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:16px;user-select:none;cursor:pointer;font-size:11px;opacity:.9;}
  .nav-item .ni{font-size:18px;} 
  .nav-item.active{background:rgba(255,196,0,.95);color:#111;opacity:1;font-weight:1000;}

  /* 🖥️ DESKTOP LAYOUT (768px+) */
  @media (min-width: 768px) {
    .app{max-width:100%;padding-bottom:0;margin-left:80px;transition:margin-left 0.3s ease;}
    .sidebar-expanded .app{margin-left:280px;}
    .topbar{position:fixed;top:0;left:80px;right:0;width:calc(100% - 80px);z-index:10;transition:left 0.3s ease;}
    .sidebar-expanded .topbar{left:280px;width:calc(100% - 280px);}
    
    /* Bottom nav → Sidebar lateral colapsable estilo YouTube */
    .bottom-nav{position:fixed;left:0;top:0;transform:none;width:80px;height:100vh;background:linear-gradient(180deg,#1f0c0c,#2f0f0f 45%,#3b1500);border:none;border-right:2px solid rgba(255,255,255,.12);border-radius:0;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 8px;gap:4px;box-shadow:0 18px 40px rgba(0,0,0,.35);backdrop-filter:blur(6px);transition:width 0.3s ease;overflow-x:hidden;z-index:100;}
    .bottom-nav.expanded{width:280px;align-items:stretch;padding:24px 12px;}
    
    /* Botón hamburguesa para toggle */
    .sidebar-toggle{display:flex;align-items:center;justify-content:center;padding:12px;margin-bottom:20px;cursor:pointer;background:rgba(255,255,255,.04);border-radius:12px;}
    .sidebar-toggle .ni{font-size:24px;}
    
    /* Nav items colapsados (solo íconos) */
    .nav-item{flex:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 8px;font-size:10px;background:rgba(255,255,255,.04);border-radius:12px;white-space:nowrap;}    
    .nav-item .ni{font-size:24px;}
    .nav-item .label{display:none;}
    .nav-item.active{background:rgba(255,196,0,.95);box-shadow:0 10px 20px rgba(0,0,0,.2);}
    
    /* Nav items expandidos */
    .bottom-nav.expanded .nav-item{flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 16px;font-size:14px;}
    .bottom-nav.expanded .nav-item .ni{font-size:22px;}
    .bottom-nav.expanded .nav-item .label{display:block;}
    
    .content{padding:20px;margin-top:130px;max-width:100%;margin-left:0;margin-right:0;}
    .gallery-section h3{display:block;color:#fff;font-size:18px;margin-top:0;margin-left:0;margin-right:0;margin-bottom:16px;}
  }
</style>
</head>

  <!-- Flickity JS (CDN) -->
  <script src="https://unpkg.com/flickity@2/dist/flickity.pkgd.min.js"></script>
  <script>
    function toggleSidebar(){
      const sidebar = document.getElementById('sidebar');
      const body = document.body;
      sidebar.classList.toggle('expanded');
      body.classList.toggle('sidebar-expanded');
    }
    
    // SERIE CARD OVERLAY - Mobile interaction
    document.querySelectorAll('.serie-card').forEach(card => {
      card.addEventListener('click', function(e) {
        e.stopPropagation();
        // Toggle overlay al hacer click en mobile
        this.classList.toggle('active');
      });
    });
    
    // Cerrar overlay si haces click fuera
    document.addEventListener('click', function() {
      document.querySelectorAll('.serie-card.active').forEach(card => {
        card.classList.remove('active');
      });
    });
    
    // FILTROS DINÁMICOS
    let currentCategoryFilter = '';
    const filterButtons = document.querySelectorAll('.filter-btn');
    const gallerySections = document.querySelectorAll('.gallery-section');
    const categoryMap = {
      'supersentai': ['superSentai'],
      'anime': ['invasionAnime'],
      'comics': ['comicAnimated'],
      'liveaction': ['liveAction'],
      'comedia': ['comedy'],
      'movies': ['movies']
    };
    
    function updateActiveFilters() {
      filterButtons.forEach(btn => {
        btn.classList.remove('active');
      });
      
      if (!currentCategoryFilter) {
        document.querySelector('[data-filter-type="todas"]').classList.add('active');
      } else {
        document.querySelector(`[data-filter-type="${currentCategoryFilter}"]`).classList.add('active');
      }
    }
    
    function applyFilters() {
      gallerySections.forEach(section => {
        const sectionId = section.id;
        
        if (!currentCategoryFilter) {
          section.classList.remove('hidden');
        } else {
          const categoryIds = categoryMap[currentCategoryFilter] || [];
          if (categoryIds.includes(sectionId)) {
            section.classList.remove('hidden');
          } else {
            section.classList.add('hidden');
          }
        }
      });
      
      updateActiveFilters();
    }
    
    function filterSeriesByCategory(category) {
      currentCategoryFilter = currentCategoryFilter === category ? '' : category;
      applyFilters();
    }
  </script>
